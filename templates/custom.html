<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Board – Shongkha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-[#030712] text-white min-h-screen">
  <div class="flex flex-col items-center justify-center min-h-screen p-6 relative overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,#1e3a8a_0%,transparent_70%)] opacity-10 pointer-events-none"></div>
    
    <div class="w-full max-w-xl z-10">
      <a href="/" class="flex items-center gap-2 text-slate-500 hover:text-white mb-8 transition-all group font-black text-[10px] uppercase tracking-[0.3em]">
        <span class="text-lg group-hover:-translate-x-1 transition-transform">←</span>
        <span>Back to Home</span>
      </a>

      <div class="glass rounded-[2rem] p-8 md:p-12 relative">
        <h2 class="text-3xl md:text-5xl font-black mb-2 tracking-tighter uppercase neon-text">Custom Board</h2>
        <p class="text-slate-500 mb-6 text-sm">Click on any cell and press a number key (1-9) or use the pad below. Press Delete/Backspace to clear.</p>

        <!-- Sudoku Grid -->
        <div class="flex justify-center mb-8">
          <div id="custom-grid" class="grid grid-cols-9 w-full max-w-[450px] aspect-square bg-[#050B18] p-1 rounded-xl shadow-[0_0_50px_rgba(30,58,138,0.3)] border-[3px] border-blue-600"></div>
        </div>

        <!-- Number Pad & Actions -->
        <div class="flex flex-col gap-4">
          <div id="num-pad-custom" class="grid grid-cols-5 gap-2">
            <!-- numbers 1-9 and clear -->
          </div>
          <div class="grid grid-cols-2 gap-4 mt-4">
            <button id="solve-btn" class="py-4 bg-blue-600 hover:bg-blue-500 rounded-xl font-black uppercase tracking-wider transition">Solve</button>
            <button id="play-btn" class="py-4 bg-green-600 hover:bg-green-500 rounded-xl font-black uppercase tracking-wider transition">Play this Board</button>
          </div>
          <button id="clear-all-btn" class="py-3 bg-white/10 hover:bg-white/20 rounded-xl text-sm font-bold uppercase tracking-wider transition">Clear All</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/custom.js"></script>
</body>
</html>
