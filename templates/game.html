<!DOCTYPE html>
<html>
<head>
  <title>Game - Shongkha</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#030712] text-white min-h-screen flex flex-col">

<!-- HEADER -->
<header class="flex justify-between items-center px-6 py-4 border-b border-white/10">

  <h1 class="text-xl font-black text-blue-500">SHONGKHA</h1>

  <div class="text-sm">
    Difficulty: <span id="difficultyText">medium</span>
  </div>

  <button onclick="goHome()" class="text-xs px-4 py-2 bg-white/10 rounded-lg">
    MENU
  </button>

</header>

<!-- MAIN -->
<div class="flex flex-1 p-6 gap-6">

  <!-- GRID -->
  <div class="flex-1 flex justify-center items-center">
    <div id="board"
         class="grid grid-cols-9 w-[400px] h-[400px] bg-[#050B18] border-2 border-blue-600">
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="w-64 space-y-4">

    <div class="bg-white/10 p-4 rounded-xl">
      <p class="text-xs opacity-50">Mistakes</p>
      <p id="mistakes">0</p>
    </div>

    <div class="bg-white/10 p-4 rounded-xl">
      <p class="text-xs opacity-50">Hints</p>
      <p id="hints">0</p>
    </div>

    <button class="w-full bg-blue-600 p-3 rounded-xl">
      AI Hint
    </button>

    <button onclick="autoSolve()" class="w-full bg-blue-500 p-3 rounded-xl hover:bg-blue-400 transition">
      Auto Solve
    </button>

    <button class="w-full bg-white/10 p-3 rounded-xl">
      Undo
    </button>

    <button class="w-full bg-white/10 p-3 rounded-xl">
      Reset
    </button>

  </div>

</div>

<script src="/static/js/game.js"></script>

</body>
</html>
